  /api/v1/chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: 执行非流式 RAG 问答
      description: 无合格检索结果时直接返回 fallback，不调用 DeepSeek。
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatRequest"}
      responses:
        "200":
          description: 完整回答或明确兜底
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatCompletionResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}

  /api/v1/chat/stream:
    post:
      tags: [Chat]
      operationId: streamChatCompletion
      summary: 通过平台 SSE 协议执行流式 RAG 问答
      description: |
        事件顺序为 meta → delta* → sources → done；异常终止为 meta → error。
        DeepSeek 的 `: keep-alive` 仅用于保持上游连接，不直接转发为业务事件。
        客户端断线后通过 getMessage 查询最终状态，重试必须复用 Idempotency-Key。
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatRequest"}
      responses:
        "200":
          description: SSE 事件流
          headers:
            Cache-Control:
              schema: {type: string, const: no-cache}
            X-Accel-Buffering:
              schema: {type: string, const: "no"}
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event: meta
                data: {"conversation_id":"70000000-0000-4000-8000-000000000001","message_id":"71000000-0000-4000-8000-000000000002","request_id":"req_01"}

                event: delta
                data: {"sequence":1,"content":"根据学生手册，"}

                event: sources
                data: {"citations":[]}

                event: done
                data: {"finish_reason":"stop","usage":{"prompt_tokens":500,"completion_tokens":60}}

        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
      x-sse-events:
        meta:
          type: object
          required: [conversation_id, message_id, request_id]
          properties:
            conversation_id: {type: string, format: uuid}
            message_id: {type: string, format: uuid}
            request_id: {type: string}
        delta:
          type: object
          required: [sequence, content]
          properties:
            sequence: {type: integer, minimum: 1}
            content: {type: string}
        sources:
          type: object
          required: [citations]
          properties:
            citations:
              type: array
              items: {$ref: "#/components/schemas/Citation"}
        done:
          type: object
          required: [finish_reason, usage]
          properties:
            finish_reason: {type: string, enum: [stop, length, content_filter, fallback]}
            usage: {$ref: "#/components/schemas/TokenUsage"}
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            message_id: {type: [string, "null"], format: uuid}

