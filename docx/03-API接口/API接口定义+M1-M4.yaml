openapi: 3.1.0
info:
  title: 学生生活一站式社区 AI 助手 API
  version: 0.4.0
  description: |
    详细设计增量 1：公共基础与 M4 平台治理；增量 2：M2 校园服务中心；
    增量 3：M1 AI 知识与对话；增量 4：M3 校园社区与互助。
    已发布 operationId 不得改变。
  contact:
    name: 项目开发小组
  license:
    name: Educational Use Only
    identifier: LicenseRef-Educational-Use-Only
servers:
  - url: http://localhost:8000
    description: 后端本地开发
  - url: http://localhost
    description: Docker Compose 演示环境
tags:
  - name: Health
    description: 存活与就绪检查
  - name: Auth
    description: 登录、刷新、退出和当前用户
  - name: Users
    description: 用户和角色分配
  - name: Roles
    description: 角色与权限管理
  - name: SensitiveWords
    description: 自定义敏感词
  - name: Moderation
    description: 内容审核工作流
  - name: Audit
    description: 只读审计日志
  - name: Config
    description: 非密钥业务配置
  - name: Dashboard
    description: MVP 基础指标
  - name: ServiceGuides
    description: 办事指南与个性化材料清单
  - name: Departments
    description: 校区、部门和有效联系人
  - name: WorkOrders
    description: 宿舍报修工单、时间线、状态流转与评价
  - name: ServiceProgress
    description: P1 外部校园系统进度查询适配器
  - name: KnowledgeBases
    description: 知识库、成员和访问范围
  - name: Documents
    description: 文档上传、Chunk 预览、发布与停用
  - name: Ingestion
    description: 异步解析、切分、Embedding 与索引任务
  - name: Conversations
    description: 用户会话、消息和最终状态查询
  - name: Chat
    description: RAG 非流式与 SSE 流式问答
  - name: Feedback
    description: 回答点赞、点踩和修正建议
  - name: Topics
    description: 社区话题字典和运营管理
  - name: Posts
    description: 帖子、匿名树洞和评论
  - name: CommunityInteractions
    description: 点赞、收藏、举报和匿名身份高敏反查
  - name: CampusEvents
    description: 校园活动发布、筛选、报名和取消
  - name: LostFound
    description: 失物/拾物发布、匹配、认领验证和双方完成
security:
  - bearerAuth: []

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 检查 API 进程是否存活
      security: []
      responses:
        "200":
          description: 进程存活
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                code: OK
                message: success
                data: {status: alive}
                request_id: 01J2ABCDEF0123456789ABCDE0
                timestamp: 2026-07-12T08:00:00Z
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 检查关键本地依赖是否就绪
      description: 检查 PostgreSQL、Redis 和 Chroma；不会调用 DeepSeek，避免产生费用。
      security: []
      responses:
        "200":
          description: 所有关键依赖就绪
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: 至少一个依赖未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 使用演示账号登录
      description: 成功后返回 Access Token，并通过 HttpOnly Cookie 设置轮换用 Refresh Token。
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: student01
              password: DemoPass123!
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: refresh_token；HttpOnly；SameSite=Lax；Path=/api/v1/auth
              schema: {type: string}
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: 账号已禁用
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example:
                code: ACCOUNT_DISABLED
                message: 账号已禁用
                details: []
                request_id: 01J2ABCDEF0123456789ABCDE0
                timestamp: 2026-07-12T08:00:00Z
        "423": {$ref: "#/components/responses/Locked"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: 轮换 Refresh Token 并获取新 Access Token
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 刷新成功，旧 Refresh Token 立即失效
          headers:
            Set-Cookie:
              description: 轮换后的 refresh_token
              schema: {type: string}
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Origin 缺失或与 FRONTEND_ORIGIN 不匹配
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 注销当前刷新会话
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 幂等注销：Cookie 缺失、未知、已撤销或有效时均清除 Cookie 并返回成功
          headers:
            Set-Cookie:
              description: 清除 refresh_token 的过期 Cookie
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "403":
          description: Origin 缺失或与 FRONTEND_ORIGIN 不匹配
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前用户、角色和权限
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 当前认证上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询用户
      x-permissions: [user:read]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          description: 按用户名、显示名或邮箱模糊搜索
          schema: {type: string, maxLength: 100}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/UserStatus"}
        - name: role_id
          in: query
          schema: {type: string, format: uuid}
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, username, -username, last_login_at, -last_login_at]
            default: -created_at
      responses:
        "200":
          description: 用户分页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建演示用户
      x-permissions: [user:write]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreateRequest"}
            example:
              username: student02
              password: DemoPass123!
              display_name: 李同学
              email: student02@example.edu
              department: 计算机学院
              role_ids: [7d827c70-2f50-4e37-9cf4-c0d57f676111]
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags: [Users]
      operationId: getUser
      summary: 获取用户详情
      x-permissions: [user:read]
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: 更新用户基本资料或状态
      description: 请求中的 version 用于乐观锁；不能通过此接口修改密码或角色。管理接口不可手工设置 `status=locked`，该值由登录失败策略产生，手工设置返回 `409 STATUS_CHANGE_NOT_ALLOWED`。
      x-permissions: [user:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpdateRequest"}
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/users/{user_id}/roles:
    put:
      tags: [Users]
      operationId: replaceUserRoles
      summary: 全量替换用户角色
      x-permissions: [user:role:assign]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserRoleAssignmentRequest"}
      responses:
        "200":
          description: 分配后的用户
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: 查询全部角色
      x-permissions: [role:read]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Roles]
      operationId: createRole
      summary: 创建自定义角色
      x-permissions: [role:write]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleCreateRequest"}
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/roles/{role_id}:
    parameters:
      - $ref: "#/components/parameters/RoleId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      tags: [Roles]
      operationId: getRole
      summary: 获取角色详情
      x-permissions: [role:read]
      responses:
        "200":
          description: 角色详情
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: 更新角色基本信息
      x-permissions: [role:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleUpdateRequest"}
      responses:
        "200":
          description: 更新后的角色
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      tags: [Roles]
      operationId: deleteRole
      summary: 删除未使用的自定义角色
      description: 系统预置角色返回 `409 SYSTEM_ROLE_PROTECTED`，仍被用户引用的角色返回 `409 ROLE_IN_USE`。
      x-permissions: [role:write]
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/roles/{role_id}/permissions:
    put:
      tags: [Roles]
      operationId: replaceRolePermissions
      summary: 全量替换角色权限
      x-permissions: [role:permission:assign]
      parameters:
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RolePermissionAssignmentRequest"}
      responses:
        "200":
          description: 更新后的角色
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/permissions:
    get:
      tags: [Roles]
      operationId: listPermissions
      summary: 查询权限字典
      x-permissions: [role:read]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: module
          in: query
          schema: {type: string, maxLength: 50}
      responses:
        "200":
          description: 权限列表
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PermissionListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/sensitive-words:
    get:
      tags: [SensitiveWords]
      operationId: listSensitiveWords
      summary: 分页查询敏感词
      x-permissions: [sensitive_word:read]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: scope
          in: query
          schema: {$ref: "#/components/schemas/SensitiveWordScope"}
        - name: enabled
          in: query
          schema: {type: boolean}
      responses:
        "200":
          description: 敏感词分页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SensitiveWordPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [SensitiveWords]
      operationId: createSensitiveWord
      summary: 创建敏感词规则
      description: 正则规则必须可编译且长度受限；重复规则返回 `409 DUPLICATE_RESOURCE`。
      x-permissions: [sensitive_word:write]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SensitiveWordCreateRequest"}
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SensitiveWordResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/sensitive-words/{word_id}:
    delete:
      tags: [SensitiveWords]
      operationId: deleteSensitiveWord
      summary: 删除敏感词规则
      description: 不存在的规则返回 `404 SENSITIVE_WORD_NOT_FOUND`。
      x-permissions: [sensitive_word:write]
      parameters:
        - name: word_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/moderation/cases:
    get:
      tags: [Moderation]
      operationId: listModerationCases
      summary: 分页查询审核案件
      x-permissions: [moderation:read]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/ModerationStatus"}
        - name: risk_level
          in: query
          schema: {$ref: "#/components/schemas/RiskLevel"}
        - name: target_module
          in: query
          schema: {type: string, enum: [ai_knowledge, campus_service, community]}
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, risk_level, -risk_level]
            default: -created_at
      responses:
        "200":
          description: 审核案件分页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModerationCasePageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/moderation/cases/{case_id}:
    get:
      tags: [Moderation]
      operationId: getModerationCase
      summary: 获取审核案件详情
      x-permissions: [moderation:read]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 审核案件详情
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModerationCaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/moderation/cases/{case_id}/decision:
    post:
      tags: [Moderation]
      operationId: decideModerationCase
      summary: 审批审核案件
      description: 只有 pending 案件可处理；终态返回 `409 MODERATION_CASE_ALREADY_DECIDED`，版本冲突返回 `409 RESOURCE_VERSION_CONFLICT`，未注册目标处理器返回 `409 MODERATION_HANDLER_UNAVAILABLE`。rule_hits 仅返回安全摘要。
      x-permissions: [moderation:decide]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModerationDecisionRequest"}
            example:
              decision: rejected
              reason: 包含针对个人的侮辱性内容
              version: 1
      responses:
        "200":
          description: 处理后的审核案件
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModerationCaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: 分页查询审计日志
      description: 只读接口；返回数据已经过脱敏。
      x-permissions: [audit:read]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: actor_user_id
          in: query
          schema: {type: string, format: uuid}
        - name: action
          in: query
