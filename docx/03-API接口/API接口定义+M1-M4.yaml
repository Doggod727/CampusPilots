  responses:
    Unauthorized:
      description: Access Token 缺失、无效或已过期
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          examples:
            unauthenticated:
              $ref: "#/components/examples/UnauthorizedError"
    Forbidden:
      description: 已认证但缺少操作或资源权限
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example:
            code: AUTH_FORBIDDEN
            message: 没有执行该操作的权限
            details: []
            request_id: 01J2ABCDEF0123456789ABCDE0
            timestamp: 2026-07-12T08:00:00Z
    NotFound:
      description: 资源不存在，或当前用户无权感知该资源
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Conflict:
      description: 唯一约束、状态机或乐观锁冲突
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example:
            code: RESOURCE_VERSION_CONFLICT
            message: 数据已被其他操作更新，请刷新后重试
            details: []
            request_id: 01J2ABCDEF0123456789ABCDE0
            timestamp: 2026-07-12T08:00:00Z
    ValidationError:
      description: 字段格式或业务输入校验失败
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example:
            code: VALIDATION_ERROR
            message: 请求参数校验失败
            details:
              - field: password
                reason: 至少 10 个字符，并包含字母、数字和特殊字符
            request_id: 01J2ABCDEF0123456789ABCDE0
            timestamp: 2026-07-12T08:00:00Z
    TooManyRequests:
      description: 请求频率超过限制
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Locked:
      description: 账号因连续登录失败被临时锁定
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PayloadTooLarge:
      description: 单文件、文件数量或整个请求超过上传限制
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    UnsupportedMediaType:
      description: 文件扩展名、MIME 或文件头不在允许列表
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    BadGateway:
      description: DeepSeek 返回不可用、余额、鉴权或无效响应等供应商错误
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    GatewayTimeout:
      description: DeepSeek 首包或总请求超时
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}

  examples:
    UnauthorizedError:
      value:
        code: AUTH_UNAUTHORIZED
        message: 登录状态无效，请重新登录
        details: []
        request_id: 01J2ABCDEF0123456789ABCDE0
        timestamp: 2026-07-12T08:00:00Z

  schemas:
    ResponseMeta:
      type: object
      required: [code, message, request_id, timestamp]
      properties:
        code: {type: string, example: OK}
        message: {type: string, example: success}
        request_id: {type: string, maxLength: 64}
        timestamp: {type: string, format: date-time}
    EmptyData:
      type: object
      additionalProperties: false
    EmptyResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseMeta"
        - type: object
          required: [data]
          properties:
            data: {$ref: "#/components/schemas/EmptyData"}
    ErrorDetail:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        field: {type: [string, "null"]}
        reason: {type: string}
        context:
          type: [object, "null"]
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [code, message, details, request_id, timestamp]
      additionalProperties: false
      properties:
