      summary: 批量上传文档并创建异步入库任务
      description: 最多 10 个文件；单文件最大 20 MiB；允许 PDF、DOCX、TXT、MD。文件名不作为对象存储路径。
      x-permissions: [knowledge:write]
      parameters:
