        "422": {$ref: "#/components/responses/ValidationError"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  headers:
    XRequestId:
      description: 服务端确认的链路请求 ID
      schema: {type: string, maxLength: 64}
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端可提供；非法或缺失时服务端生成新 ID
      schema: {type: string, minLength: 8, maxLength: 64}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一用户和接口 24 小时内重放返回首次结果
      schema: {type: string, minLength: 8, maxLength: 128}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RoleId:
      name: role_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    GuideId:
      name: guide_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DepartmentId:
      name: department_id
      in: path
      required: true
      schema: {type: string, format: uuid}
